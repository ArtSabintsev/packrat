[project]
name = "packrat"
version = "1.0.0"
description = "Batch-redeem Pokémon TCG Live codes through the macOS game client"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    # PyPI hard-rejects any upload carrying this. This tool is private.
    "Private :: Do Not Upload",
    "Operating System :: MacOS",
]
dependencies = [
    "typer>=0.15",
    "rich>=13.9",
    "pyobjc-framework-quartz>=12.2.2",
    "pyobjc-framework-vision>=12.2.2",
    "pyobjc-framework-cocoa>=12.2.2",
    "pyobjc-framework-applicationservices>=12.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[project.scripts]
packrat = "packrat.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"packrat/cli.py" = ["E501"]
